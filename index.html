<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRD & Research Proposal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 3px 6px rgba(140,149,159,0.15);
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 12px;
    }
    p.subtitle {
      color: #57606a;
      margin-bottom: 24px;
    }
    .card {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 16px;
      background-color: #fcfcfc;
    }
    .card h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    .card p {
      margin: 0 0 16px 0;
      color: #57606a;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      background-color: #2da44e;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 6px;
    }
    .btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRD and Reserach Proposal</h1>
    <p class="subtitle">Submission for Product Requirements Document (PRD) and Research Proposal.</p>

    <div class="card">
      <h2>1. Product Requirements Document (PRD)</h2>
      <a class="btn" href="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/davidmalena555/AIBS_AEL/main/AEL_PRD.pdf" target="_blank">Open PRD (PDF)</a>
    </div>

    <div class="card">
      <h2>2. Research Proposal</h2>
      <a class="btn" href="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/davidmalena555/AIBS_AEL/main/AIBS_Handbook.pdf" target="_blank">Open Research Proposal (PDF)</a>
    </div>
  </div>

</body>
</html>
